[project]
name = "medal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guarisadavi", email = "guarisadavi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brasil-data>=3.0.1",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "logging>=0.4.9.6",
    "marimo>=0.24.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "plotly>=7.0.0",
    "pyarrow>=25.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
medal = "medal:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
